name: Deploy

# Automatisches Deployment ausschließlich vom main-Branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Verhindert parallele, sich überholende Deployments.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    # Zusätzliche Absicherung: nur main darf deployen.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          # Bricht das Skript beim ersten Fehler ab.
          script_stop: true
          # DEPLOY_PATH wird als Umgebungsvariable übergeben (nicht geloggt).
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            echo "==> Wechsle in Projektverzeichnis: ${DEPLOY_PATH}"
            cd "${DEPLOY_PATH}"

            echo "==> Hole aktuellen Code"
            git fetch --all
            git checkout main
            git pull origin main

            echo "==> Prüfe, ob .env vorhanden ist"
            if [ ! -f .env ]; then
              echo "FEHLER: .env fehlt im Projektverzeichnis. Deployment abgebrochen." >&2
              exit 1
            fi

            echo "==> Baue und starte Container"
            docker compose pull || true
            docker compose build
            docker compose up -d

            echo "==> Bereinige ungenutzte Images"
            docker image prune -f

            echo "==> Deployment abgeschlossen"
