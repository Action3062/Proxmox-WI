# nginx config for the frontend container: serve the built SPA.
# API requests are routed to the backend by the separate reverse-proxy service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for fingerprinted assets.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every unknown path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
