# Reverse proxy: single entry point for the application.
#   /api/*  -> FastAPI backend
#   /*      -> frontend (static SPA)

upstream backend {
    server backend:8000;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # Allow reasonably large request bodies (e.g. long SSH keys / descriptions).
    client_max_body_size 16m;

    # API -> backend. The /api prefix is preserved upstream.
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deployments can take a while; allow long-lived responses.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else -> frontend SPA.
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
