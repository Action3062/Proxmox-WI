# Reverse proxy: single entry point for the application.
#   /api/*  -> FastAPI backend
#   /*      -> frontend (static SPA)
#
# Upstreams are addressed via variables together with Docker's embedded DNS
# resolver (127.0.0.11). This forces nginx to re-resolve the service names at
# runtime, so the proxy keeps working after a container is recreated with a new
# IP (e.g. on every `docker compose up -d` redeploy). A static `upstream` block
# caches the IP at startup, which causes 504 errors after a redeploy.

server {
    listen 80;
    server_name _;

    # Allow reasonably large request bodies (e.g. long SSH keys / descriptions).
    client_max_body_size 16m;

    # Docker's internal DNS; short TTL so recreated container IPs are picked up.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API -> backend. The full /api/... URI is preserved upstream.
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Deployments can take a while; allow long-lived responses.
        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Everything else -> frontend SPA.
    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:80$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
